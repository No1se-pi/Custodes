# Локальный проект уже существует в установленном SonarQube под этим ключом.
sonar.projectKey=custodes-local
sonar.projectName=Custodes
sonar.projectVersion=1.1.0

sonar.sources=custodes,parser.py,lib,locales,custodes.sh,installer.sh,install.ps1
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11
sonar.working.directory=.sonar/work
sonar.scanner.metadataFilePath=.sonar/report-task.txt

# Пользовательские окружения, Git и результаты анализа не являются исходниками.
sonar.exclusions=venv/**,.venv/**,.git/**,.sonar/**,.scannerwork/**,**/__pycache__/**
